[project]
name = "maemul-on-api"
version = "0.1.0"
description = "매물온 API — 매물·계약 만기·고객 관리"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Windows에는 시스템 tz 데이터베이스가 없다. zoneinfo("Asia/Seoul")에 필요하다.
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maemul_on"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff는 Markdown 안의 Python 코드 블록도 포맷한다.
# 문서의 예시는 설명을 위해 일부러 다르게 쓰므로 제외한다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # 타입 주석 누락
    "S",        # bandit (보안)
    "T20",      # print 금지 — 구조화 로그를 쓴다
    "RUF",
]
ignore = [
    "ANN401",  # Any 허용이 필요한 자리가 있다
]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert(S101)와 print를 허용한다.
"tests/**" = ["S101", "T20", "ANN"]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: 외부 의존성 없는 도메인·유틸 테스트",
    "repository: 테스트 PostgreSQL이 필요한 테스트 (TASK-0002)",
    "contract: OpenAPI·adapter 계약 테스트 (fake server)",
    "security: 두 사용자 격리 테스트 (TASK-0002)",
    "db: DB가 필요한 테스트 (TASK-0002)",
]
