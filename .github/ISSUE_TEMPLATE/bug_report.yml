name: 🐞 Bug report
description: Report broken behaviour in the web app, API, or developer harness.
title: "bug: "
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        > [!IMPORTANT]
        > **Never paste real customer data.** No phone numbers, customer names,
        > consultation notes, uploaded workbooks, OAuth tokens, or authorization codes.
        > Redact them before submitting — this repository treats PII in issues and logs
        > as a defect in itself.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [existing issues](https://github.com/bigmooon/maemul-on/issues?q=is%3Aissue) and found no duplicate.
          required: true
        - label: I confirmed this is not already listed as deprecated in `docs/product/deprecated.md`.
          required: true
        - label: I removed all personal data from the report below.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what is broken.
      placeholder: The home expiry list drops properties once a contact is logged.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably produce the bug.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened, and which requirement or invariant says so.
      placeholder: "Per INV-03, completing a contact must not remove the property from the expiry list."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Include exact error codes and redacted log output.
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - "apps/web (UI, input state, accessibility)"
        - "apps/api (auth, validation, domain rules, transactions)"
        - "packages/api-client (generated client)"
        - "ai (prompts, schemas, policies)"
        - "evals (datasets, graders)"
        - "scripts / Makefile (doctor, init, smoke, verify)"
        - "docs"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: invariant
    attributes:
      label: Violated invariant (if any)
      description: "Invariant IDs from `AGENTS.md`, comma separated. Leave blank if none applies."
      placeholder: INV-03, INV-06

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "critical — data loss, cross-user data exposure, or PII leak"
        - "high — core flow (expiry → contact → consultation log) is blocked"
        - "medium — feature is degraded but has a workaround"
        - "low — cosmetic or developer-experience issue"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `make doctor` is the fastest way to fill this in.
      value: |
        - OS:
        - Node / pnpm:
        - Python (uv-managed):
        - Browser:
        - Commit SHA:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, failing test output, or related issues and ADRs.
