# Label definitions referenced by the issue templates.
#
# Apply to the repository with:
#   bash scripts/sync-labels.sh            # create or update
#   bash scripts/sync-labels.sh --dry-run  # print the gh commands only
#
# Keep this file and the repository labels in step — the issue forms fail
# silently when a label they set does not exist. The sync script never deletes
# a label; removing one is a manual `gh label delete <name>`.

- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as specified"
- name: "type: feature"
  color: "0e8a16"
  description: "A new user-facing capability"
- name: "type: task"
  color: "1d76db"
  description: "One vertical slice backed by a TASK document"
- name: "type: docs"
  color: "0075ca"
  description: "Requirements, ADRs, runbooks, README"
- name: "type: chore"
  color: "cfd3d7"
  description: "Tooling, dependencies, developer harness"

- name: "status: needs triage"
  color: "fbca04"
  description: "Not yet reviewed by a maintainer"
- name: "status: accepted"
  color: "c2e0c6"
  description: "Agreed and ready to be worked on"
- name: "status: in progress"
  color: "bfd4f2"
  description: "Someone is actively working on it"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on another task or an external decision"
- name: "status: needs ADR"
  color: "d4c5f9"
  description: "Requires a decision record before implementation"

- name: "area: web"
  color: "5319e7"
  description: "apps/web — presentation, input state, accessibility"
- name: "area: api"
  color: "5319e7"
  description: "apps/api — auth, validation, domain rules, transactions"
- name: "area: ai"
  color: "5319e7"
  description: "ai/ — prompts, schemas, policies"
- name: "area: evals"
  color: "5319e7"
  description: "evals/ — datasets, graders, reports"
- name: "area: harness"
  color: "5319e7"
  description: "scripts/, Makefile, make.ps1, CI"

- name: "priority: critical"
  color: "b60205"
  description: "Data loss, cross-user exposure, or PII leak"
- name: "priority: high"
  color: "e99695"
  description: "Blocks the core expiry → contact → consultation flow"
- name: "priority: low"
  color: "ededed"
  description: "Can wait"

- name: "invariant"
  color: "ff9500"
  description: "Touches a product invariant (INV-01 … INV-14)"
- name: "security"
  color: "b60205"
  description: "Ownership filtering, PII handling, OAuth, secrets"
- name: "good first issue"
  color: "7057ff"
  description: "Good entry point for a new contributor"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is welcome"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Intentionally not being worked on"
